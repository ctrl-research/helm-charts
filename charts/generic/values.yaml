# The generic chart renders the Kubernetes manifests you define in this file.
# Each top-level key maps a resource name to that resource's full manifest:
#
#   deployments:
#     web:                    # becomes "<release>-web"
#       metadata:
#         labels:
#           app: web
#       spec:
#         replicas: 1
#         selector:
#           matchLabels:
#             app: web
#         template:
#           metadata:
#             labels:
#               app: web
#           spec:
#             containers:
#               - name: web
#                 image: nginx:1.27
#                 ports:
#                   - containerPort: 80
#
#   services:
#     web:
#       spec:
#         selector:
#           app: web
#         ports:
#           - port: 80
#             targetPort: 80
#         type: ClusterIP
#
# The chart supplies apiVersion and kind based on the key, and rewrites
# metadata.name to "<release>-<key>". Every other field is rendered verbatim;
# apiVersion, kind, and metadata.name you write are ignored. Because names are
# prefixed with the release name, cross-references must use the full name
# (e.g. serviceAccountName: "<release>-app" inside a Deployment).
#
# Supported keys (apiVersion/kind supplied by the chart):
#   services                  v1                          Service
#   endpoints                 v1                          Endpoints
#   configmaps                v1                          ConfigMap
#   secrets                   v1                          Secret
#   serviceAccounts           v1                          ServiceAccount
#   pods                      v1                          Pod
#   persistentVolumeClaims    v1                          PersistentVolumeClaim
#   persistentVolumes         v1                          PersistentVolume
#   replicationControllers    v1                          ReplicationController
#   resourceQuotas            v1                          ResourceQuota
#   limitRanges               v1                          LimitRange
#   deployments               apps/v1                     Deployment
#   replicaSets               apps/v1                     ReplicaSet
#   statefulSets              apps/v1                     StatefulSet
#   daemonSets                apps/v1                     DaemonSet
#   jobs                      batch/v1                    Job
#   cronJobs                  batch/v1                    CronJob
#   horizontalPodAutoscalers  autoscaling/v2              HorizontalPodAutoscaler
#   ingresses                 networking.k8s.io/v1        Ingress
#   ingressClasses            networking.k8s.io/v1        IngressClass
#   networkPolicies           networking.k8s.io/v1        NetworkPolicy
#   podDisruptionBudgets      policy/v1                   PodDisruptionBudget
#   roles                     rbac.authorization.k8s.io/v1 Role
#   roleBindings              rbac.authorization.k8s.io/v1 RoleBinding
#   clusterRoles              rbac.authorization.k8s.io/v1 ClusterRole
#   clusterRoleBindings       rbac.authorization.k8s.io/v1 ClusterRoleBinding
#   storageClasses            storage.k8s.io/v1           StorageClass
#   endpointSlices            discovery.k8s.io/v1         EndpointSlice
#   priorityClasses           scheduling.k8s.io/v1        PriorityClass
#   leases                    coordination.k8s.io/v1      Lease
#   runtimeClasses            node.k8s.io/v1              RuntimeClass
#
# Note: Namespaces are intentionally not a supported key. Helm manages the
# release namespace via --namespace/--create-namespace, so charts should not
# create Namespace objects.

# Global metadata deep-merged into every resource's metadata block. The
# resource's own metadata takes precedence over this on key conflicts, and the
# chart-managed metadata.name always wins.
#
#   metadata:
#     labels:
#       app.kubernetes.io/part-of: myapp
#       team: platform
#     annotations:
#       example.com/owner: platform
#
# Note: metadata.name is always "<release>-<key>". Avoid setting `namespace`
# here if you also define cluster-scoped resources (ClusterRole, StorageClass,
# PersistentVolume, ...), which do not accept a namespace.
metadata: {}

services: {}
endpoints: {}
configmaps: {}
secrets: {}
serviceAccounts: {}
pods: {}
persistentVolumeClaims: {}
persistentVolumes: {}
replicationControllers: {}
resourceQuotas: {}
limitRanges: {}
deployments: {}
replicaSets: {}
statefulSets: {}
daemonSets: {}
jobs: {}
cronJobs: {}
horizontalPodAutoscalers: {}
ingresses: {}
ingressClasses: {}
networkPolicies: {}
podDisruptionBudgets: {}
roles: {}
roleBindings: {}
clusterRoles: {}
clusterRoleBindings: {}
storageClasses: {}
endpointSlices: {}
priorityClasses: {}
leases: {}
runtimeClasses: {}