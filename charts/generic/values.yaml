# All resources are created as <release-name>-<key>. Cross-references between
# resources (HPA scaleTargetRef, ingress backends, serviceAccountName) accept
# the short key of another resource in this file and resolve it to the full
# chart-managed name automatically; any other value is passed through verbatim
# (e.g. serviceAccountName: default, or a service that exists outside this release).

# deployments:
#   app:
#     image:
#       registry: docker.io          # default
#       repository: nginx            # required
#       tag: "1.27"                  # required
#       pullPolicy: IfNotPresent     # default
#       pullSecrets: []
#     containerName: ""              # defaults to the key ("app")
#     command: []
#     args: []
#     ports:
#       - name: http
#         containerPort: 80
#         protocol: TCP
#     env: []
#     envFrom: []
#     resources: {}
#     livenessProbe: {}
#     readinessProbe: {}
#     startupProbe: {}
#     lifecycle: {}
#     volumeMounts: []
#     volumes: []
#     initContainers: []
#     extraContainers: []            # additional container specs, passed through verbatim
#     replicas: 1                    # omit when the deployment is managed by an HPA
#     strategy: {}
#     serviceAccountName: ""         # key from serviceAccounts below, or an existing SA name
#     annotations: {}                # deployment metadata annotations, e.g. reloader.stakater.com/auto: "true"
#     podAnnotations: {}
#     podSecurityContext: {}
#     securityContext: {}
#     priorityClassName: ""
#     terminationGracePeriodSeconds: 30
#     nodeSelector: {}
#     tolerations: []
#     affinity: {}
#     topologySpreadConstraints: []

# services:
#   app:                             # selects the pods of deployments.app by default
#     type: ClusterIP
#     clusterIP: ""                  # set to None for a headless service
#     annotations: {}
#     ports:
#       - port: 80
#         targetPort: http
#         protocol: TCP
#         name: http
#     selector: {}                   # override only to select pods not managed by this release

# configmaps:
#   app-config:
#     data:
#       key: value
#     binaryData: {}

# secrets:
#   app-secret:
#     type: Opaque
#     stringData:
#       password: ""
#     data: {}                       # pre-encoded base64 values

# serviceAccounts:
#   app:
#     annotations: {}
#     imagePullSecrets: []

# persistentVolumeClaims:
#   app-data:
#     storageClass: ""               # omit for the cluster default; "" disables dynamic provisioning
#     accessMode: ReadWriteOnce
#     size: 8Gi
#     annotations: {}

# horizontalPodAutoscalers:
#   app:
#     scaleTargetRef: {}             # defaults to the deployment matching this key ("app")
#     minReplicas: 1
#     maxReplicas: 10                # required
#     targetCPUUtilizationPercentage: 80
#     targetMemoryUtilizationPercentage: ""
#     metrics: []                    # additional raw autoscaling/v2 metric entries
#     behavior: {}

# ingresses:
#   app:
#     className: ""
#     annotations: {}
#     hosts:
#       - host: chart-example.local
#         paths:
#           - path: /
#             pathType: Prefix       # default
#             backend:
#               service:
#                 name: app          # key from services above, or an external service name
#                 port:
#                   number: 80       # or name: http
#     tls: []

deployments: {}
services: {}
configmaps: {}
secrets: {}
serviceAccounts: {}
persistentVolumeClaims: {}
horizontalPodAutoscalers: {}
ingresses: {}
