{{- range $name, $config := .Values.configmaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "generic.labels" (dict "releaseName" $.Release.Name "name" $name) | nindent 4 }}
data:
  {{- toYaml $config.data | nindent 2 }}
{{- end }}
