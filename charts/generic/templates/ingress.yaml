{{- range $name, $config := .Values.ingresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic.fullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "generic.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $config.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $config.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $config.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $svcName := .backend.service.name }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- /* keys in .Values.services resolve to their chart-managed name; anything else passes through verbatim */}}
                name: {{ if hasKey ($.Values.services | default dict) $svcName }}{{ include "generic.fullname" (dict "root" $ "name" $svcName) }}{{ else }}{{ $svcName }}{{ end }}
                port:
                  {{- if .backend.service.port.name }}
                  name: {{ .backend.service.port.name }}
                  {{- else }}
                  number: {{ .backend.service.port.number }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
