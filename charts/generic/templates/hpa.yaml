{{- range $name, $config := .Values.horizontalPodAutoscalers }}
{{- $target := $config.scaleTargetRef | default dict }}
{{- $targetKind := $target.kind | default "Deployment" }}
{{- $targetName := $target.name | default $name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "generic.fullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "generic.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ $target.apiVersion | default "apps/v1" }}
    kind: {{ $targetKind }}
    {{- /* keys in .Values.deployments resolve to their chart-managed name; anything else passes through verbatim */}}
    name: {{ if and (eq $targetKind "Deployment") (hasKey ($.Values.deployments | default dict) $targetName) }}{{ include "generic.fullname" (dict "root" $ "name" $targetName) }}{{ else }}{{ $targetName }}{{ end }}
  minReplicas: {{ $config.minReplicas | default 1 }}
  maxReplicas: {{ required (printf "horizontalPodAutoscalers.%s.maxReplicas is required" $name) $config.maxReplicas }}
  {{- if or $config.targetCPUUtilizationPercentage $config.targetMemoryUtilizationPercentage $config.metrics }}
  metrics:
    {{- with $config.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $config.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $config.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- with $config.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
