{{- range $name, $config := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "generic.labels" (dict "releaseName" $.Release.Name "name" $name) | nindent 4 }}
spec:
  type: {{ $config.type | default "ClusterIP" }}
  {{- with $config.ports }}
  ports:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- toYaml ($config.selector | default (dict "app.kubernetes.io/name" (printf "%s-%s" $.Release.Name $name))) | nindent 4 }}
{{- end }}
