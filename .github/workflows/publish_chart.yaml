name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Auto-bump stale chart versions
        run: |
          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            version=$(grep '^version:' "${chart}Chart.yaml" | awk '{print $2}')
            tag="${chart_name}-${version}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              if [ -n "$(git diff "$tag" HEAD -- "$chart")" ]; then
                echo "Chart $chart_name changed since $tag, bumping"
                IFS='.' read -r major minor patch <<< "$version"
                patch=$((patch + 1))
                new_version="${major}.${minor}.${patch}"
                sed -i "s/^version: .*/version: ${new_version}/" "${chart}Chart.yaml"
                git add "${chart}Chart.yaml"
              else
                echo "Chart $chart_name unchanged since $tag, skipping"
              fi
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump stale chart versions [skip ci]"
          fi

      - name: Push version bumps
        run: git push
        if: success()

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
