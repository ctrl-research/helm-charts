name: Test Charts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "Linting ${chart}"
            helm lint "${chart}"
          done

      - name: Render and validate manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(charts/*/ci/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CI values files found in charts/*/ci/"
            exit 0
          fi
          for values in "${files[@]}"; do
            chart="$(dirname "$(dirname "${values}")")"
            echo "Rendering ${values}"
            helm template example "${chart}" -f "${values}" | kubeconform -strict -summary
          done